<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골든 스탑워치</title>
<style>
  :root {
    --bg: #e6f2fa;
    --card: #ffffff;
    --text: #3b3524;
    --muted: #7f8f76;
    --line: #dfead6;
    --accent: #e8a33d;
    --accent-text: #3d2711;
    --danger: #d9683f;
    --best: #4f9a5b;
    --worst: #d9683f;
    --fur: #e8b04a;
    --fur-dark: #c98a2b;
    --muzzle: #f8e2b0;
    --shadow: 0 8px 24px rgba(60, 110, 60, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14202a;
      --card: #1c2a22;
      --text: #f3ead4;
      --muted: #8fa488;
      --line: #2f4034;
      --accent: #f0b24a;
      --accent-text: #2a1a08;
      --danger: #e8805a;
      --best: #7cc788;
      --worst: #e8805a;
      --shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Jua", "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app { width: 100%; max-width: 440px; }

  .display {
    position: relative;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 32px;
    padding: 0;
    text-align: center;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  /* ---- 강아지 사진 ---- */
  .dog-wrap {
    position: relative;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: #9cc7e6;
  }
  .dog {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 20% 30%;
    transform-origin: 30% 100%;
    transition: filter .4s;
  }
  .dog[data-state="idle"] { filter: saturate(.8) brightness(.96); }
  .dog[data-state="running"] { animation: trot .5s ease-in-out infinite; }
  .dog[data-state="paused"] { animation: tilt 2.4s ease-in-out infinite; }
  .dog.hop { animation: hop .45s ease-out; }

  @keyframes trot { 0%,100% { transform: scale(1.04) translateY(0) rotate(-.6deg); } 50% { transform: scale(1.04) translateY(-4px) rotate(.6deg); } }
  @keyframes tilt { 0%,100% { transform: scale(1.02) rotate(-1deg); } 50% { transform: scale(1.02) rotate(1deg); } }
  @keyframes hop { 0% { transform: scale(1); } 35% { transform: scale(1.08) translateY(-8px); } 100% { transform: scale(1); } }

  .bubble {
    position: absolute;
    top: 34%; left: 40%;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 18px;
    padding: 4px 12px;
    border-radius: 14px 14px 14px 2px;
    opacity: 0;
    transform: scale(.6);
    transform-origin: 0 100%;
    pointer-events: none;
  }
  .bubble.show { animation: pop .8s ease-out; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.6); }
    20% { opacity: 1; transform: scale(1.1); }
    35% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(1); }
  }

  /* ---- 시간 ---- */
  .hud {
    position: absolute;
    top: 12px; right: 12px;
    padding: 8px 16px 10px;
    border-radius: 20px;
    color: #fff;
    text-shadow: 0 2px 0 rgba(60, 40, 10, .55), 0 0 12px rgba(40, 25, 5, .5);
    text-align: right;
    pointer-events: none;
  }
  .time {
    font-variant-numeric: tabular-nums;
    font-size: clamp(34px, 11vw, 52px);
    line-height: 1;
    letter-spacing: 1px;
  }
  .time .ms { color: #fff; }
  .lap-current {
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
    color: #fff;
    font-size: 14px;
    min-height: 1.2em;
  }

  /* ---- 버튼 ---- */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    --bone-fill: var(--card);
    --bone-stroke: var(--line);
    position: relative;
    height: 68px;
    font: inherit;
    font-size: 20px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--text);
    cursor: pointer;
    transition: transform .08s, opacity .15s;
  }
  button .bone {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    overflow: visible;
    filter: drop-shadow(0 4px 0 var(--bone-stroke));
    transition: filter .08s;
  }
  button .bone-line { fill: var(--bone-stroke); stroke: var(--bone-stroke); stroke-width: 5; stroke-linejoin: round; }
  button .bone-body { fill: var(--bone-fill); }
  button .label { position: relative; }
  button:active:not(:disabled) { transform: translateY(3px); }
  button:active:not(:disabled) .bone { filter: drop-shadow(0 1px 0 var(--bone-stroke)); }
  button .paw { width: 1.3em; height: 1.3em; vertical-align: -.25em; margin-right: 6px; fill: currentColor; }
  button .paw-fly {
    position: absolute;
    left: var(--x); top: 18%;
    width: 24px; height: 24px;
    margin-left: -12px;
    fill: var(--bone-stroke);
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    animation: fly .85s ease-out forwards;
  }
  button.stamp .label .paw { animation: stamp .45s ease-out; }
  @keyframes fly {
    0% { opacity: 0; transform: translateY(0) rotate(var(--r)) scale(.4); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-70px) rotate(var(--r)) scale(1.1); }
  }
  @keyframes stamp {
    0% { transform: scale(1); }
    30% { transform: scale(1.7) rotate(-22deg); }
    60% { transform: scale(.85) rotate(8deg); }
    100% { transform: scale(1) rotate(0); }
  }
  button:disabled { opacity: .45; cursor: default; }
  button.primary {
    --bone-fill: var(--accent);
    --bone-stroke: var(--fur-dark);
    color: var(--accent-text);
  }
  button.stop {
    --bone-fill: var(--danger);
    --bone-stroke: #a8472a;
    color: #fff;
  }

  /* ---- 랩 ---- */
  .laps { list-style: none; margin: 20px 0 0; padding: 0; }
  .laps li {
    display: grid;
    grid-template-columns: 64px 1fr 1fr;
    align-items: center;
    padding: 12px 8px;
    border-bottom: 2px dashed var(--line);
    font-variant-numeric: tabular-nums;
    font-size: 17px;
  }
  .laps li span:nth-child(2), .laps li span:nth-child(3) { text-align: right; }
  .laps li span:nth-child(3) { color: var(--muted); }
  .laps li.best span:nth-child(2)::before { content: "🦴 "; }
  .laps li.best span:nth-child(2) { color: var(--best); }
  .laps li.worst span:nth-child(2) { color: var(--worst); }

  .hint { margin-top: 16px; text-align: center; color: var(--muted); font-size: 14px; }
  kbd {
    font-family: inherit;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 0 6px;
    background: var(--card);
  }
  @media (prefers-reduced-motion: reduce) {
    button .paw-fly, button.stamp .label .paw { animation: none !important; }
    .dog { animation: none !important; }
  }
</style>

    <button id="primary" class="primary"><svg class="bone" viewBox="0 0 200 64" preserveAspectRatio="none" aria-hidden="true"><g class="bone-line"><circle cx="17" cy="17" r="14"/><circle cx="17" cy="47" r="14"/><circle cx="183" cy="17" r="14"/><circle cx="183" cy="47" r="14"/><rect x="6" y="17" width="28" height="30"/><rect x="166" y="17" width="28" height="30"/><rect x="17" y="13" width="166" height="38" rx="8"/></g><g class="bone-body"><circle cx="17" cy="17" r="14"/><circle cx="17" cy="47" r="14"/><circle cx="183" cy="17" r="14"/><circle cx="183" cy="47" r="14"/><rect x="6" y="17" width="28" height="30"/><rect x="166" y="17" width="28" height="30"/><rect x="17" y="13" width="166" height="38" rx="8"/></g></svg><span class="label" id="primaryLabel">시작</span></button>
  </div>

  <ul class="laps" id="laps"></ul>

  <p class="hint"><kbd>Space</kbd> 시작/정지 · <kbd>L</kbd> 랩 · <kbd>R</kbd> 리셋</p>
</main>

<script>
  const timeEl = document.getElementById('time');
  const lapCurrentEl = document.getElementById('lapCurrent');
  const lapsEl = document.getElementById('laps');
  const primaryBtn = document.getElementById('primary');
  const secondaryBtn = document.getElementById('secondary');
  const primaryLabel = document.getElementById('primaryLabel');
  const secondaryLabel = document.getElementById('secondaryLabel');
  const dogEl = document.getElementById('dog');
  const bubbleEl = document.getElementById('bubble');

  const PAW = '<svg class="paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="4.6" cy="11" rx="2.3" ry="3"/><ellipse cx="9" cy="5.6" rx="2.3" ry="3.1"/><ellipse cx="15" cy="5.6" rx="2.3" ry="3.1"/><ellipse cx="19.4" cy="11" rx="2.3" ry="3"/><path d="M12 11c-3.6 0-6.6 3.6-6.6 6.6 0 2.2 1.8 3 3.6 3 1.2 0 2-.5 3-.5s1.8.5 3 .5c1.8 0 3.6-.8 3.6-3 0-3-3-6.6-6.6-6.6z"/></svg>';
  let running = false;
  let startAt = 0;     // performance.now() 기준 시작 시각
  let elapsed = 0;     // 정지 시점까지 누적된 시간(ms)
  let laps = [];       // 각 랩의 총 경과 시간(ms)
  let rafId = null;

  function now() {
    return running ? elapsed + (performance.now() - startAt) : elapsed;
  }

  function format(ms) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const s = totalSec % 60;
    const m = Math.floor(totalSec / 60) % 60;
    const h = Math.floor(totalSec / 3600);
    const pad = n => String(n).padStart(2, '0');
    const main = (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
    return { main, cs: '.' + pad(cs) };
  }

  function text(ms) {
    const f = format(ms);
    return f.main + f.cs;
  }

  function render() {
    const t = now();
    const f = format(t);
    timeEl.innerHTML = f.main + '<span class="ms">' + f.cs + '</span>';
    const last = laps.length ? laps[laps.length - 1] : 0;
    lapCurrentEl.textContent = (laps.length || running) && t > 0
      ? '랩 ' + (laps.length + 1) + '  ' + text(t - last)
      : '';
  }

  function renderLaps() {
    const splits = laps.map((t, i) => t - (i ? laps[i - 1] : 0));
    const best = splits.length > 1 ? Math.min(...splits) : null;
    const worst = splits.length > 1 ? Math.max(...splits) : null;
    lapsEl.innerHTML = '';
    for (let i = splits.length - 1; i >= 0; i--) {
      const li = document.createElement('li');
      if (splits[i] === best) li.className = 'best';
      else if (splits[i] === worst) li.className = 'worst';
      li.innerHTML = '<span>랩 ' + (i + 1) + '</span><span>' + text(splits[i]) +
        '</span><span>' + text(laps[i]) + '</span>';
      lapsEl.appendChild(li);
    }
  }

  function tick() {
    render();
    rafId = requestAnimationFrame(tick);
  }

  function updateButtons() {
    primaryLabel.innerHTML = running ? PAW + '정지' : (elapsed > 0 ? PAW + '계속' : PAW + '시작');
    primaryBtn.classList.toggle('stop', running);
    primaryBtn.classList.toggle('primary', !running);
    secondaryLabel.innerHTML = PAW + (running || elapsed === 0 ? '랩' : '리셋');
    secondaryBtn.disabled = !running && elapsed === 0;
    dogEl.dataset.state = running ? 'running' : (elapsed > 0 ? 'paused' : 'idle');
  }

  function woof(word) {
    bubbleEl.textContent = word;
    for (const el of [bubbleEl, dogEl]) el.classList.remove('show', 'hop');
    void dogEl.getBoundingClientRect();   // 애니메이션 재시작
    bubbleEl.classList.add('show');
    dogEl.classList.add('hop');
  }

  function pawBurst(btn) {
    btn.classList.remove('stamp');
    void btn.offsetWidth;
    btn.classList.add('stamp');
    for (let i = 0; i < 3; i++) {
      const el = document.createElement('span');
      el.innerHTML = PAW;
      const svg = el.firstChild;
      svg.setAttribute('class', 'paw-fly');
      svg.style.setProperty('--x', (22 + i * 28 + Math.random() * 8) + '%');
      svg.style.setProperty('--r', (Math.random() * 50 - 25) + 'deg');
      svg.style.animationDelay = (i * 0.09) + 's';
      svg.addEventListener('animationend', () => svg.remove());
      btn.appendChild(svg);
    }
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startAt;
      running = false;
      cancelAnimationFrame(rafId);
      render();
    } else {
      startAt = performance.now();
      running = true;
      tick();
      woof('왈!');
    }
    pawBurst(primaryBtn);
    updateButtons();
  }

  function lap() {
    if (!running) return;
    pawBurst(secondaryBtn);
    laps.push(now());
    renderLaps();
    woof('멍!');
  }

  function reset() {
    if (running) return;
    pawBurst(secondaryBtn);
    elapsed = 0;
    laps = [];
    renderLaps();
    render();
    updateButtons();
  }

  primaryBtn.addEventListener('click', toggle);
  secondaryBtn.addEventListener('click', () => running ? lap() : reset());

  document.addEventListener('keydown', e => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'KeyL') lap();
    else if (e.code === 'KeyR') reset();
  });

  render();
  updateButtons();
</script>
</body>
</html>
